name: Run Automated Tests

on:
  push:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: pytest -v --junitxml=test-results.xml

      - name: Send test report
        id: report
        if: always() && steps.tests.outcome != 'skipped'
        env:
          RECEIVER_URL: ${{ vars.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/generate_report.py test-results.xml

      - name: Fail if tests or report delivery failed
        if: always() && (steps.tests.outcome != 'success' || steps.report.outcome != 'success')
        run: |
          echo "Tests outcome: ${{ steps.tests.outcome }}"
          echo "Report delivery outcome: ${{ steps.report.outcome }}"
          exit 1