name: Run Automated Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      test_outcome: ${{ steps.tests.outcome }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        id: tests
        continue-on-error: true
        run: pytest -v --junitxml=test-results.xml

      - name: Send test report
        id: report
        if: always() && steps.tests.outcome != 'skipped'
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/generate_report.py test-results.xml

      - name: Email test report
        id: email
        if: always() && steps.tests.outcome != 'skipped' && vars.EMAIL_REPORT_ENABLED == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python -m scripts.send_email test-results.xml

      - name: Fail if tests or report delivery failed
        if: always() && (steps.tests.outcome != 'success' || steps.report.outcome != 'success' || (vars.EMAIL_REPORT_ENABLED == 'true' && steps.email.outcome != 'success'))
        run: |
          echo "Tests outcome: ${{ steps.tests.outcome }}"
          echo "Report delivery outcome: ${{ steps.report.outcome }}"
          echo "Email outcome: ${{ steps.email.outcome }}"
          exit 1

  deploy-pages:
    needs: test
    if: always() && needs.test.outputs.test_outcome == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4